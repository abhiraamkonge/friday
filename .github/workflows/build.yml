name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon > build.log 2>&1 || BUILD_FAILED=1
          echo "### BUILD DIAGNOSTICS ###"
          grep -E "(e: |error:|FAILED|FAILURE)" build.log -B 2 -A 6 | head -n 50 || true
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "### FULL BUILD LOG ###"
            cat build.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (easy download from phone)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
